name: Deploy comments worker

# 手動觸發(Actions 頁面按 Run workflow,或由 API 觸發)。
# 需要先在 repo Settings → Secrets and variables → Actions 設定:
#   CLOUDFLARE_API_TOKEN   — Cloudflare「編輯 Cloudflare Workers」範本權杖
#   COMMENTS_GITHUB_TOKEN  — fine-grained PAT(只限本 repo,Contents: Read and write)
# (帳號 ID 會用權杖自動偵測;若偵測不到再加 CLOUDFLARE_ACCOUNT_ID secret)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check secrets present
        run: |
          ok=1
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "OK CLOUDFLARE_API_TOKEN 已設定"; else echo "::error::CLOUDFLARE_API_TOKEN 沒讀到 — 請確認 repo Settings → Secrets and variables → Actions → Secrets 分頁裡有這個名字"; ok=0; fi
          if [ -n "${{ secrets.COMMENTS_GITHUB_TOKEN }}" ]; then echo "OK COMMENTS_GITHUB_TOKEN 已設定"; else echo "::error::COMMENTS_GITHUB_TOKEN 沒讀到 — 請確認 repo Settings → Secrets and variables → Actions → Secrets 分頁裡有這個名字"; ok=0; fi
          [ "$ok" = "1" ] || exit 1
      - name: Deploy worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # account_id 讀 wrangler.toml
          workingDirectory: workers/comments
          secrets: |
            GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.COMMENTS_GITHUB_TOKEN }}
