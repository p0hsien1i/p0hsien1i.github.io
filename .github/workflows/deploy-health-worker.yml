name: Deploy health worker

# 手動觸發（Actions 頁面 → Deploy health worker → Run workflow）。
# 需要先在 repo Settings → Secrets and variables → Actions 設定：
#   CLOUDFLARE_API_TOKEN — 和留言 worker 用的是同一個（「編輯 Cloudflare Workers」範本權杖，含 Workers KV）
#   HEALTH_SYNC_TOKEN    — 飯糰 Fit「設定 → Apple 健康同步 → 產生密碼」產生的那串
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/health
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 4c4dafb959f8ff4ffec435b07602a9b8
      KV_TITLE: apo-health-data
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: workers/health
      - name: Check secrets present
        env:
          HAS_SYNC: ${{ secrets.HEALTH_SYNC_TOKEN != '' }}
        run: |
          ok=1
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "OK CLOUDFLARE_API_TOKEN 已設定"; else echo "::error::CLOUDFLARE_API_TOKEN 沒讀到"; ok=0; fi
          if [ "$HAS_SYNC" = "true" ]; then echo "OK HEALTH_SYNC_TOKEN 已設定"; else echo "::error::HEALTH_SYNC_TOKEN 沒讀到 — 請到 repo Settings → Secrets and variables → Actions 新增"; ok=0; fi
          [ "$ok" = "1" ] || exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find or create KV namespace
        run: |
          set -euo pipefail
          find_id() {
            npx --yes wrangler@4 kv namespace list 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>x.title===process.env.KV_TITLE||x.title.endsWith("-"+process.env.KV_TITLE));process.stdout.write(n?n.id:"")})'
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            echo "建立 KV namespace $KV_TITLE"
            npx --yes wrangler@4 kv namespace create "$KV_TITLE"
            id="$(find_id)"
          fi
          [ -n "$id" ] || { echo "::error::找不到也無法建立 KV namespace（Cloudflare 權杖需要 Workers KV Storage: Edit 權限）"; exit 1; }
          echo "KV namespace id: $id"
          sed -i "s/__KV_ID__/$id/" wrangler.toml
      - name: Deploy worker
        run: npx --yes wrangler@4 deploy
      - name: Set SYNC_TOKEN secret
        env:
          SYNC_TOKEN: ${{ secrets.HEALTH_SYNC_TOKEN }}
        run: printf '%s' "$SYNC_TOKEN" | npx --yes wrangler@4 secret put SYNC_TOKEN
      - name: Smoke test
        env:
          SYNC_TOKEN: ${{ secrets.HEALTH_SYNC_TOKEN }}
        run: |
          sleep 5
          curl -fsS https://apo-health.pohsienbrianli.workers.dev/ && echo
          curl -fsS -H "Authorization: Bearer $SYNC_TOKEN" https://apo-health.pohsienbrianli.workers.dev/data && echo
