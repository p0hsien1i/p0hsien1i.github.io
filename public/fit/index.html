<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Brian as the Chef</title>
  <meta name="description" content="記錄每天吃了什麼、攝取多少熱量，資料只存在你的裝置上。" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#e10600" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Brian as the Chef" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="brand"><img src="icon.svg" alt="" width="24" height="24" /><span>Brian <em>as the</em> Chef</span></h1>
    <div class="datebar">
      <button class="icon-btn" data-action="prev-day" aria-label="前一天">‹</button>
      <button class="date-btn" data-action="pick-date"><span id="date-label">今天</span></button>
      <input type="date" id="date-input" class="visually-hidden" tabindex="-1" aria-hidden="true" />
      <button class="icon-btn" data-action="next-day" aria-label="後一天">›</button>
    </div>
  </header>

  <main id="app">
    <section class="view" id="view-home" data-view="home"></section>
    <section class="view" id="view-diary" data-view="diary" hidden></section>
    <section class="view" id="view-progress" data-view="progress" hidden></section>
    <section class="view" id="view-settings" data-view="settings" hidden></section>
  </main>

  <nav class="tabbar" aria-label="主選單">
    <button data-tab="home" aria-current="page"><span class="ti">◉</span>總覽</button>
    <button data-tab="diary"><span class="ti">☰</span>日記</button>
    <button class="tab-add" data-action="add-food" aria-label="新增食物"><span>＋</span></button>
    <button data-tab="progress"><span class="ti">↗</span>進度</button>
    <button data-tab="settings"><span class="ti">⚙</span>設定</button>
  </nav>

  <!-- 新增食物 -->
  <dialog id="dlg-food" class="sheet">
    <div class="sheet-head">
      <h2>新增食物 <small id="food-meal-label"></small></h2>
      <button class="icon-btn" data-close aria-label="關閉">✕</button>
    </div>
    <form id="food-search-form" class="search-row">
      <input id="food-q" type="search" placeholder="搜尋：雞胸肉、珍奶、7-11…" autocomplete="off" enterkeyhint="search" />
      <button type="submit" class="btn">搜尋</button>
    </form>
    <div class="chip-row">
      <button class="chip" data-action="scan">📷 掃條碼</button>
      <button class="chip" data-action="new-custom">✏️ 自行輸入</button>
      <button class="chip" data-action="drink">🧋 手搖飲</button>
      <button class="chip" data-action="quick-add">⚡ 只記熱量</button>
    </div>
    <div id="food-results" class="list"></div>
  </dialog>

  <!-- 份量 -->
  <dialog id="dlg-qty" class="sheet">
    <form id="qty-form" method="dialog">
      <div class="sheet-head">
        <h2 id="qty-title">份量</h2>
        <button type="button" class="icon-btn" data-close aria-label="關閉">✕</button>
      </div>
      <p class="muted" id="qty-sub"></p>
      <div class="grid2">
        <label><span id="qty-unit">份數</span><input id="qty-amount" type="number" inputmode="decimal" min="0" step="any" required /></label>
        <label>餐別<select id="qty-meal"></select></label>
      </div>
      <div class="macro-preview" id="qty-preview"></div>
      <div class="btn-row">
        <button type="button" class="btn ghost danger" id="qty-delete" hidden>刪除</button>
        <button type="submit" class="btn primary" id="qty-submit">加入</button>
      </div>
    </form>
  </dialog>

  <!-- 自訂食物 / 快速加入 -->
  <dialog id="dlg-custom" class="sheet">
    <form id="custom-form" method="dialog">
      <div class="sheet-head">
        <h2 id="custom-title">自訂食物</h2>
        <button type="button" class="icon-btn" data-close aria-label="關閉">✕</button>
      </div>
      <p class="muted" id="custom-hint"></p>
      <label>名稱<input name="name" required placeholder="例如：媽媽的滷雞腿" /></label>
      <label id="custom-serving-wrap">每份的描述<input name="serving" placeholder="例如：1 包 (45g)、1 碗" /></label>
      <div class="grid2">
        <label>熱量 kcal<input name="kcal" type="number" inputmode="decimal" min="0" step="any" required /></label>
        <label>蛋白質 g<input name="p" type="number" inputmode="decimal" min="0" step="any" /></label>
        <label>碳水 g<input name="c" type="number" inputmode="decimal" min="0" step="any" /></label>
        <label>脂肪 g<input name="f" type="number" inputmode="decimal" min="0" step="any" /></label>
      </div>
      <label class="check" id="custom-save-wrap"><input type="checkbox" name="saveMine" checked /> 存到「我的食物」，下次可以直接搜尋</label>
      <input type="hidden" name="mode" />
      <input type="hidden" name="barcode" />
      <input type="hidden" name="editId" />
      <div class="btn-row"><button type="submit" class="btn primary" id="custom-submit">儲存</button></div>
    </form>
  </dialog>

  <!-- 手搖飲計算機 -->
  <dialog id="dlg-drink" class="sheet">
    <form id="drink-form" method="dialog">
      <div class="sheet-head">
        <h2>🧋 手搖飲計算</h2>
        <button type="button" class="icon-btn" data-close aria-label="關閉">✕</button>
      </div>
      <p class="field-title">飲料</p><div class="seg" id="drink-base"></div>
      <p class="field-title">杯型</p><div class="seg" id="drink-size"></div>
      <p class="field-title">甜度</p><div class="seg" id="drink-sugar"></div>
      <p class="field-title">配料（可複選）</p><div class="seg" id="drink-toppings"></div>
      <label>店家／備註（選填）<input name="note" placeholder="例如：50嵐、可不可" /></label>
      <label>記在<select id="drink-meal"></select></label>
      <div class="drink-total"><b class="num" id="drink-kcal">0</b> kcal <span class="muted" id="drink-detail"></span></div>
      <p class="muted">各店配方不同，數字僅供估算；想要更準可以用「自行輸入」填店家公布的熱量。</p>
      <div class="btn-row"><button type="submit" class="btn primary">加入</button></div>
    </form>
  </dialog>

  <!-- 條碼 -->
  <dialog id="dlg-scan" class="sheet">
    <div class="sheet-head">
      <h2>掃描條碼</h2>
      <button class="icon-btn" data-close aria-label="關閉">✕</button>
    </div>
    <div class="scan-box" id="scan-box" hidden>
      <video id="scan-video" playsinline muted autoplay></video>
      <div class="scan-guide" aria-hidden="true"></div>
    </div>
    <p class="muted" id="scan-hint"></p>
    <div id="scan-actions" class="chip-row"></div>
    <label class="chip photo-chip">📸 用照片辨識<input type="file" id="scan-photo" accept="image/*" capture="environment" class="visually-hidden" /></label>
    <form id="barcode-form" class="search-row" style="margin-top:10px">
      <input id="barcode-input" inputmode="numeric" placeholder="或手動輸入條碼數字" />
      <button class="btn">查詢</button>
    </form>
  </dialog>

  <!-- 從雲端還原（確認） -->
  <dialog id="dlg-restore" class="sheet">
    <form id="restore-form" method="dialog">
      <div class="sheet-head">
        <h2>確認還原</h2>
        <button type="button" class="icon-btn" data-close aria-label="關閉">✕</button>
      </div>
      <p class="muted" id="restore-sub"></p>
      <div id="restore-diff"></div>
      <div id="restore-confirm">
        <p class="note">還原會用這個版本<b>整份取代</b>目前的資料，手機和電腦都會一起變成這個版本。還原前會自動保存一份目前的資料，可以用「↩️ 取消上次還原」回去。</p>
        <label>請輸入「還原」兩個字確認<input id="restore-word" autocomplete="off" placeholder="還原" /></label>
        <div class="btn-row">
          <button type="button" class="btn" data-close>取消</button>
          <button type="submit" class="btn primary" id="restore-submit" disabled>還原</button>
        </div>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
